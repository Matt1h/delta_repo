hydra:
  run:
    dir: ${result_dir}
  sweep:
    dir: ${result_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - molecule=benzene
    - experiment=cross_validation
    - experiment.n_cv_samples=1000
    - experiment/model_init/hyper_inits=combinations
    - experiment/model_init/hyper_inits/general_hypers=combinations3
    - dataset.remove_offset=True
    - dataset.trajectory_type=rmd17
    - dataset.trajectory_name=full
    - dataset.function.property_=gs_energies
    - dataset.calculation_methods=[rmd17_energy]
    - result_name=combinations3_1000
  job:
    name: ${result_name}
    chdir: null
    override_dirname: dataset.calculation_methods=[rmd17_energy],dataset.function.property_=gs_energies,dataset.remove_offset=True,dataset.trajectory_name=full,dataset.trajectory_type=rmd17,experiment.n_cv_samples=1000,experiment/model_init/hyper_inits/general_hypers=combinations3,experiment/model_init/hyper_inits=combinations,experiment=cross_validation,molecule=benzene,result_name=combinations3_1000
    id: '0'
    num: 0
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/mholzenkam/dev/active_learning/active
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/mholzenkam/dev/active_learning/active/config
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/mholzenkam/dev/experiments/benzene/cross_validation/rmd17_full_rmd17_energy/GPR_coulomb_rbf/combinations3_1000/0
    choices:
      representation: coulomb
      method: gpr
      method/kernel: rbf
      method/likelihood: gaussian
      dataset: trajectory
      experiment: cross_validation
      experiment/model_init: different_param_combinations
      experiment/model_init/hyper_inits: combinations
      experiment/model_init/hyper_inits/general_hypers: combinations3
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
