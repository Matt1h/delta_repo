result_name: combinations3_1000
result_dir: ../../experiments/${molecule}/${experiment.name}/${dataset.name}/${method.name}_${representation.name}_${method.kernel.name}/${result_name}
molecule: sma
experiment:
  model_init:
    hyper_inits:
      general_hypers:
        noise:
        - 0.001
        - 1.0e-06
        - 1.0e-08
        outputscale:
          _target_: utils.config.cross_validation.get_log_scale
          lengthscale_log_start: 0
          lengthscale_log_end: 2
          n_lengthscales: 1
        lengthscale:
          _target_: utils.config.cross_validation.get_log_scale
          lengthscale_log_start: 0
          lengthscale_log_end: 1.5
          n_lengthscales: 3
      params:
        _target_: utils.config.cross_validation.get_diff_combination_hyper_inits
        likelihood_hyper_names: ${method.likelihood.hyper_names}
        kernel_hyper_names: ${method.kernel.hyper_names}
        general_hypers: ${experiment.model_init.hyper_inits.general_hypers}
    params:
      likelihood:
      - ${method.likelihood.likelihood}
      kernel:
      - ${method.kernel.kernel}
      fit_mode:
      - train_hypers
      hyper_inits: ${experiment.model_init.hyper_inits.params}
      lr:
      - ${method.method.lr}
      n_steps:
      - ${method.method.n_steps}
  name: cross_validation
  n_cv_samples: 1000
  function:
    _target_: experiments.cross_validation.run_cross_validation
    n_cv_samples: ${experiment.n_cv_samples}
    calculation_method: ${dataset.energy_calculation_method}
    method: ${method.method}
    possible_params: ${experiment.model_init.params}
    remove_offset: ${dataset.remove_offset}
    mlflow_log: true
dataset:
  name: ${dataset.trajectory_type}_${dataset.trajectory_name}_${dataset.energy_calculation_method}
  trajectory_type: ws22
  trajectory_name: full
  energy_calculation_method: ws22_energies
  trajectory_length: null
  remove_offset: true
  path: ../../test_quantum-chemistry-data/${molecule}/${dataset.trajectory_type}/geometries/${dataset.trajectory_name}.xyz
  function:
    _target_: molecule_data.trajectory.Trajectory
    path: ${dataset.path}
    calculation_methods:
    - ${dataset.energy_calculation_method}
    geometry_inds:
      _target_: utils.config.trajectory.inds_from_trajectory_length
      trajectory_length: ${dataset.trajectory_length}
    property_: gs_energy
method:
  likelihood:
    likelihood:
      _target_: gpytorch.likelihoods.GaussianLikelihood
      noise_constraint:
        _target_: gpytorch.constraints.GreaterThan
        lower_bound: 1.0e-12
    hyper_names:
    - likelihood.noise_covar.noise
  kernel:
    name: rbf
    calc_representation: true
    kernel:
      _target_: gpytorch.kernels.RBFKernel
      ard_num_dims:
        _target_: active.utils.config.gpr.get_ard_dim
        path: ${dataset.path}
        representation: ${representation.function}
        representation_kwargs: ${representation.kwargs}
    hyper_names:
    - covar_module.outputscale
    - covar_module.base_kernel.lengthscale
  name: GPR
  method:
    _target_: active.models.gpr.model.GaussianProcessRegression
    likelihood: ${method.likelihood.likelihood}
    kernel: ${method.kernel.kernel}
    fit_mode: fixed_hypers
    lr: 0.1
    n_steps: 200
    _partial_: true
representation:
  name: coulomb
  function: molecule_data.representations.coulomb.coulomb
  kwargs:
    charges:
      _target_: active.utils.config.representation.get_charges
      xyz_path: ${dataset.path}
